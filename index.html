<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R:Link | 소기업 연구비 AI</title>
<meta name="description" content="계획서로 비목별 예산표를 짜고, 지출 가능 여부를 근거와 함께 판정하고, 잔액과 할 일을 관리하는 소기업 연구비 대시보드.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231D3FBB'/%3E%3Ctext x='32' y='45' font-family='serif' font-weight='900' font-size='40' text-anchor='middle' fill='white'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FF;--paper:#FFFFFF;--ink:#1A2238;--sub:#434D68;--muted:#636D88;--line:#E4E9F5;
  --field:#F5F7FF;--field-line:#8E99B8;--soft:#EBEFFB;
  --accent:#3350F0;--accent-soft:#E6EBFF;--btn:#3B5BFF;--btn-h:#2A45DB;--btn-ink:#FFFFFF;
  --seal:#D12F35;--seal-soft:#FFE8E8;
  --ok:#0A8A5F;--ok-bg:#DDF7EC;--cond:#A35F00;--cond-bg:#FFF0D2;--no:#C7272D;--no-bg:#FFE3E3;
  --side:#FFFFFF;--side-ink:#434D68;--side-mute:#636D88;--nav-on:#E6EBFF;--nav-on-ink:#2A45DB;
  --hero:#3B5BFF;--hero-ink:#FFFFFF;--hero-sub:#E3E8FF;--hero-track:rgba(255,255,255,.28);--hero-fill:#FFD84D;--hero-card:rgba(255,255,255,.16);
  --shadow:0 1px 2px rgba(40,60,140,.06),0 8px 24px rgba(40,60,140,.07);
  --serif:'Noto Serif KR','Noto Serif CJK KR','Nanum Myeongjo',serif;
  --sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK KR',sans-serif;
}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
  --bg:#0D1224;--paper:#171E38;--ink:#EEF1FA;--sub:#C5CCE0;--muted:#A4AECA;--line:#2A3355;
  --field:#1E2747;--field-line:#7480A6;--soft:#232D52;
  --accent:#A9B8FF;--accent-soft:#263272;--btn:#4A66FF;--btn-h:#6079FF;
  --seal:#FF8A8A;--seal-soft:#43202A;
  --ok:#6BE0B4;--ok-bg:#12382E;--cond:#FFC766;--cond-bg:#40300F;--no:#FF9A9A;--no-bg:#43202A;
  --side:#121830;--side-ink:#C5CCE0;--side-mute:#A4AECA;--nav-on:#263272;--nav-on-ink:#FFFFFF;
  --hero:#3550E6;--shadow:none;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,dl,dd{margin:0;padding:0}
ul,ol{list-style:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tn{font-variant-numeric:tabular-nums}

/* 틀 */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:26px 14px 20px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--serif);font-weight:900;font-size:28px;color:#fff;padding:0 12px;line-height:1.2}
.brand span{display:block;font-family:var(--sans);font-weight:500;font-size:13px;color:var(--side-mute);margin-top:4px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--side-ink);font:inherit;font-weight:600;text-align:left;cursor:pointer}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-selected=true]{background:var(--nav-on);color:var(--nav-on-ink)}
.nav svg{width:20px;height:20px;flex:0 0 20px}
.side-note{margin-top:auto;font-size:12.5px;line-height:1.55;color:var(--side-mute);padding:0 12px}
main{padding:36px clamp(16px,3.6vw,48px) 40px;min-width:0}
.inner{max-width:1160px}
.inner.narrow{max-width:820px}
@media (max-width:900px){
  .app{display:block}
  .side{position:sticky;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:10px 12px;z-index:5}
  .brand{font-size:22px;padding:0 6px;margin-right:auto}.brand span,.side-note{display:none}
  .nav{flex-direction:row;flex-wrap:wrap;gap:2px}.nav button{min-height:44px;padding:0 10px;font-size:15px}.nav svg{display:none}
  main{padding-top:24px}
}

/* 머리글 */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:24px}
.head h1{font-family:var(--serif);font-weight:900;font-size:clamp(26px,3.6vw,34px);line-height:1.3;letter-spacing:-.01em}
.head p{color:var(--sub);margin-top:4px;max-width:42em}

/* 판 */
.grid{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.col{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:20px}
.col.wide{flex:1.9 1 480px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:24px}
.panel>h2{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.panel>h2 .sp{margin-left:auto}
.hint{font-size:14px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:15px}

/* 단추와 입력 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;min-height:46px;padding:0 20px;border-radius:10px;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--btn-h);border-color:var(--btn-h)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--field-line)}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:8px}
.btn.text{background:none;border:0;color:var(--muted);min-height:38px;padding:0 8px;font-size:14px;font-weight:500}
.btn.text:hover{color:var(--seal);background:none}
.btn.text.go{color:var(--accent);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--sub);flex:1 1 150px;min-width:0}
input,select,textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--field);border:1px solid var(--field-line);border-radius:10px;padding:9px 12px;min-height:46px;width:100%}
input:focus,select:focus,textarea:focus{background:var(--paper);border-color:var(--accent)}
textarea{min-height:220px;resize:vertical;line-height:1.6}
input.num{text-align:right;font-variant-numeric:tabular-nums}
input[type=checkbox]{width:22px;height:22px;min-height:0;flex:0 0 22px;accent-color:var(--btn);padding:0}

/* 표 */
.tbl-box{overflow-x:auto;margin:0 -6px;padding:0 6px}
table{border-collapse:collapse;width:100%;font-size:15px}
th{text-align:left;font-size:13px;font-weight:600;color:var(--muted);padding:0 6px 8px;white-space:nowrap}
td{padding:6px;vertical-align:middle;border-top:1px solid var(--line)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td input,td select{min-height:40px;padding:6px 10px;border-color:transparent;border-radius:8px}
td input:hover,td select:hover{border-color:var(--field-line)}
tfoot td{font-weight:700;border-top:2px solid var(--ink);padding-top:12px}
.tbl-box table{min-width:520px}

/* 대시보드 */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:18px;padding:30px 32px;display:flex;flex-wrap:wrap;gap:28px 48px;align-items:flex-end;margin-bottom:20px}
.hero-main{flex:2 1 380px;min-width:0}
.hero-main span{color:var(--hero-sub);font-size:15px;font-weight:500}
.hero-main b{display:block;font-size:clamp(34px,5.4vw,52px);font-weight:700;line-height:1.2;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0 18px}
.track{height:12px;border-radius:99px;background:var(--hero-track);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--hero-fill)}
.hero-main small{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--hero-sub);margin-top:10px;font-variant-numeric:tabular-nums}
.hero-side{flex:1 1 240px;display:flex;gap:28px;flex-wrap:wrap}
.hero-side div span{display:block;font-size:14px;color:var(--hero-sub)}
.hero-side div b{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.cats li{display:grid;grid-template-columns:140px minmax(60px,1fr) 190px;gap:6px 18px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.cats li:first-child{border-top:0;padding-top:0}
.cats .nm{font-weight:600}
.cats .amt{text-align:right;font-variant-numeric:tabular-nums}
.cats .amt b{display:block;font-size:17px}
.cats .amt span{font-size:13px;color:var(--muted)}
.cats .amt b.neg{color:var(--seal)}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--btn)}
.bar i.over{background:var(--seal)}
@media (max-width:560px){.cats li{grid-template-columns:1fr auto}.cats .bar{grid-column:1/-1;grid-row:2}}
.rows li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.rows .grow{flex:1;min-width:0}
.done{text-decoration:line-through;color:var(--muted)}
.late{color:var(--seal);font-weight:600}
.quick{display:flex;gap:8px}
.quick input{flex:1}

/* 단계 */
.steps{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.steps button{display:flex;align-items:center;gap:10px;font:inherit;font-weight:600;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:99px;min-height:46px;padding:0 18px 0 8px;cursor:pointer}
.steps button i{font-style:normal;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:14px;font-variant-numeric:tabular-nums}
.steps button[aria-current=step]{color:var(--ink);border-color:var(--ink)}
.steps button[aria-current=step] i{background:var(--btn);color:var(--btn-ink)}
.steps button:disabled{cursor:default;opacity:.6}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;border:2px dashed var(--field-line);border-radius:14px;padding:26px 16px;cursor:pointer;color:var(--sub);font-weight:600;font-size:16px;background:var(--field)}
.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.drop span{font-weight:400;font-size:14px;color:var(--muted)}
.drop input{position:absolute;opacity:0;width:1px;height:1px;min-height:0;padding:0}
.drop:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.or{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:14px;margin:18px 0 12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.note{background:var(--accent-soft);border-radius:10px;padding:12px 16px;font-size:15px;margin-bottom:20px}
.msg{display:flex;gap:12px;padding:12px 14px;border-radius:10px;font-size:15px;background:var(--seal-soft);margin-top:8px}
.msg b{white-space:nowrap;color:var(--seal);flex:0 0 auto}
.msg.good{background:var(--good-soft)}.msg.good b{color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
.actions .sp{margin-left:auto}

/* 판정 */
.askbox{display:flex;gap:10px;flex-wrap:wrap}
.askbox input{flex:1 1 260px;min-height:56px;font-size:17px;padding:0 18px;background:var(--paper)}
.askbox .btn{min-height:56px;padding:0 26px}
.sugs{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sugs button{font:inherit;font-size:14px;font-weight:500;color:var(--sub);background:var(--paper);border:1px solid var(--line);border-radius:99px;min-height:38px;padding:0 14px;cursor:pointer}
.sugs button:hover{border-color:var(--accent);color:var(--accent)}
.slip{background:var(--paper);border:1px solid var(--ink);border-radius:14px;padding:28px;margin-top:24px}
.slip-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap}
.slip-top small{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.slip .q{font-family:var(--serif);font-weight:700;font-size:clamp(20px,3vw,26px);line-height:1.4;flex:1 1 320px;min-width:0}
.stamp{display:inline-block;border:3px solid var(--seal);color:var(--seal);font-family:var(--serif);font-weight:900;font-size:24px;padding:4px 16px;border-radius:8px;transform:rotate(-4deg);letter-spacing:.04em;white-space:nowrap}
.stamp.ok{border-color:var(--accent);color:var(--accent)}
.stamp.no{border-color:var(--ink);color:var(--ink)}
.stamp.ask{border-style:dashed;border-color:var(--muted);color:var(--muted);font-size:20px}
.kv{margin-top:20px}
.kv div{display:flex;gap:18px;padding:13px 0;border-top:1px solid var(--line)}
.kv dt{flex:0 0 76px;font-weight:600;font-size:14px;color:var(--muted);padding-top:1px}
.kv dd{min-width:0;flex:1}
.chip{display:inline-block;font-size:13px;font-weight:700;line-height:1.5;padding:1px 10px;border-radius:6px;border:1px solid transparent;white-space:nowrap}
.chip.ok{background:var(--btn);color:var(--btn-ink)}
.chip.cond{background:var(--paper);color:var(--seal);border-color:var(--seal)}
.chip.no{background:var(--ink);color:var(--bg)}
.chip.ask{background:var(--paper);color:var(--muted);border:1px dashed var(--muted)}
.chip.draft{background:var(--soft);color:var(--sub);font-weight:600}
.chip.rev{background:var(--accent-soft);color:var(--accent);font-weight:600}
.hist li{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist .grow{flex:1 1 240px;min-width:0}
.hist select{width:auto;min-height:38px;padding:4px 10px;font-size:14px}

/* 규정 */
.params{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.params label{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;flex:1 1 220px}
.params .unit{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink)}
.params input{font-size:20px;font-weight:700}
.rule{border-top:1px solid var(--line)}
.rule:first-of-type{border-top:0}
.rule>button{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;width:100%;min-height:56px;padding:10px 4px;background:none;border:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.rule>button:hover{background:var(--field)}
.rule>button .t{font-weight:600;flex:1 1 260px;min-width:0}
.rule>button .k{font-size:13px;color:var(--muted);flex:1 1 200px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rule-edit{padding:8px 4px 22px;display:flex;flex-direction:column;gap:12px}
.rule-edit textarea{min-height:84px}
.rule-edit>label{flex:0 0 auto}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}

/* 밝은 테마 */
.side{border-right:1px solid var(--line)}
.brand{color:var(--btn)}
@media (prefers-color-scheme:dark){.brand{color:#fff}}
.nav button:hover{background:var(--soft)}
.panel{border:0;box-shadow:var(--shadow);border-radius:18px}
.params label{border:0;box-shadow:var(--shadow);border-radius:18px}
.hero{border-radius:22px}
.hero-side{gap:12px}
.hero-side div{background:var(--hero-card);border-radius:14px;padding:12px 18px;min-width:120px}
.btn{border-radius:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:10px;vertical-align:1px}
.chip{border-radius:99px;padding:2px 12px;border:0}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.cond{background:var(--cond-bg);color:var(--cond);border:0}
.chip.no{background:var(--no-bg);color:var(--no)}
.chip.ask{background:var(--soft);color:var(--sub);border:0}
.stamp{border-color:var(--cond);color:var(--cond)}
.stamp.ok{border-color:var(--ok);color:var(--ok)}
.stamp.no{border-color:var(--no);color:var(--no)}
.slip{border:0;box-shadow:var(--shadow);border-radius:22px;border-top:8px solid var(--cond)}
.slip.ok{border-top-color:var(--ok)}.slip.no{border-top-color:var(--no)}.slip.ask{border-top-color:var(--field-line)}
.msg{background:var(--cond-bg)}.msg b{color:var(--cond)}
.msg.error{background:var(--no-bg)}.msg.error b{color:var(--no)}
.msg.good{background:var(--ok-bg)}.msg.good b{color:var(--ok)}
.late{color:var(--no)}
.steps button{border:0;box-shadow:var(--shadow)}
.steps button[aria-current=step]{background:var(--btn);color:var(--btn-ink)}
.steps button[aria-current=step] i{background:#fff;color:var(--btn)}
.sugs button{border:0;background:var(--accent-soft);color:var(--nav-on-ink);font-weight:600}
.sugs button:hover{background:var(--btn);color:#fff}
.askbox input{border:2px solid var(--btn);border-radius:16px}
.askbox .btn{border-radius:16px}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--soft);margin-bottom:18px}
.stack i{display:block;height:100%}
.note{border-radius:14px}
tfoot td{border-top-color:var(--line)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">R:Link<span>소기업 연구비 AI</span></div>
  <nav class="nav" role="tablist" aria-label="화면">
    <button role="tab" data-tab="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>대시보드</button>
    <button role="tab" data-tab="budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg>예산 편성</button>
    <button role="tab" data-tab="ask"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>지출 판정</button>
    <button role="tab" data-tab="rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg>규정 DB</button>
  </nav>
  <p class="side-note">입력한 내용은 이 브라우저에만 저장됩니다. 판정은 참고용이며 최종 판단은 전문기관 확인이 필요합니다.</p>
</aside>
<main><div id="view"></div></main>
</div>
<script>
'use strict';

const blank=()=>({project:{name:'',months:12,total:0,gov:0},planText:'',people:[],items:[],draft:null,budget:null,expenses:[],todos:[],queries:[],rules:JSON.parse(JSON.stringify(SEED_RULES)),params:{allowancePct:20,indirectPct:5,equipReview:30000000},tab:'dash',step:1,note:'',openRule:null});
let S=load();
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.rules)return Object.assign(blank(),j);}catch(e){}return blank();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>Math.round(n||0).toLocaleString('ko-KR')+'원';
const num=v=>{const n=parseInt(String(v).replace(/[^\d-]/g,''),10);return isNaN(n)?0:n;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);

/* ---------- 금액 읽기 ---------- */
const AMT=/\d[\d,.]*\s*(?:억|천만|백만|만|천)?(?:\s*\d[\d,.]*\s*(?:천만|백만|만|천))*\s*원/g;
const UNIT={'억':1e8,'천만':1e7,'백만':1e6,'만':1e4,'천':1e3};
function parseKRW(s){let t=0,m;const re=/(\d[\d,.]*)\s*(억|천만|백만|만|천)?/g;while((m=re.exec(s))){t+=parseFloat(m[1].replace(/,/g,''))*(m[2]?UNIT[m[2]]:1);}return Math.round(t);}
function firstAmt(s){const m=s.match(AMT);return m?parseKRW(m[0]):0;}

/* ---------- F1 계획서 읽기와 예산 편성 ---------- */
function classify(name){const n=name.toLowerCase();
 if(/위탁/.test(n))return'위탁연구개발비';
 if(/(노트북|컴퓨터|pc|서버|장비|기기|측정|태블릿|프린터|모니터|워크스테이션|카메라|설비)/.test(n)&&!/(이용료|임차|클라우드)/.test(n))return'연구시설·장비비';
 if(/(재료|시약|부품|시제품|소재|샘플|금형|목업)/.test(n))return'연구재료비';
 return'연구활동비';}
function extractPlan(text){
 const out={project:Object.assign({},S.project),people:[],items:[]};let m;
 if((m=text.match(/(?:연구개발)?과제명\s*[:：]?\s*(.+)/)))out.project.name=m[1].trim().slice(0,60);
 if((m=text.match(/(\d{1,2})\s*개월/)))out.project.months=+m[1];
 text.split(/\r?\n/).forEach(raw=>{
  const line=raw.replace(/^[\s\-–•·*○●▶\d.)]+/,'').trim();if(!line)return;
  const amts=line.match(AMT);if(!amts)return;
  if(/총\s*(연구개발비|사업비|연구비)/.test(line)){out.project.total=parseKRW(amts[0]);
   const g=line.match(/정부\s*지원[^\d]*/);if(g&&amts[1])out.project.gov=parseKRW(amts[1]);return;}
  if(/정부\s*지원|정부출연/.test(line)){out.project.gov=parseKRW(amts[0]);return;}
  const rate=line.match(/(\d{1,3})\s*%/);
  if(rate&&/(월|급여|연구원|대표|책임|인건비)/.test(line)){
   const name=line.split(amts[0])[0].replace(/월\s*$/,'').replace(/[,:：]\s*$/,'').trim().slice(0,24)||'참여연구원';
   out.people.push({id:uid(),name:name,salary:parseKRW(amts[0]),rate:Math.min(+rate[1],100)});return;}
  const name=line.split(amts[0])[0].replace(/[,:：]\s*$/,'').trim().slice(0,40);
  if(name)out.items.push({id:uid(),name:name,amount:parseKRW(amts[0]),cat:classify(name)});
 });
 return out;}
function laborOf(){return S.people.reduce((a,p)=>a+Math.round(p.salary*p.rate/100*S.project.months),0);}
function makeDraft(){
 const d={};CATS.forEach(c=>d[c]=0);
 d['인건비']=laborOf();
 S.items.forEach(i=>{d[i.cat]=(d[i.cat]||0)+i.amount;});
 d['연구수당']=Math.floor(d['인건비']*S.params.allowancePct/100);
 const direct=CATS.filter(c=>c!=='간접비').reduce((a,c)=>a+d[c],0);
 d['간접비']=Math.floor(direct*S.params.indirectPct/100);
 S.draft=d;}
const sum=o=>CATS.reduce((a,c)=>a+(o&&o[c]||0),0);
function validate(d){
 const r=[],P=S.params,labor=d['인건비'],direct=sum(d)-d['간접비'],tot=sum(d);
 if(!tot){return r;}
 S.people.forEach(p=>{if(p.rate>100||p.rate<=0)r.push({lv:'error',t:'참여율',m:esc(p.name)+'의 참여율('+p.rate+'%)이 0~100% 범위를 벗어납니다.'});});
 if(S.people.length&&Math.abs(labor-laborOf())>1)r.push({lv:'warn',t:'인건비',m:'인건비가 참여인력 기준 산정액('+won(laborOf())+')과 다릅니다.'});
 const aMax=Math.floor(labor*P.allowancePct/100);
 if(d['연구수당']>aMax)r.push({lv:'error',t:'연구수당',m:'인건비의 '+P.allowancePct+'%('+won(aMax)+')를 넘습니다. '+won(d['연구수당']-aMax)+' 초과.'});
 const iMax=Math.floor(direct*P.indirectPct/100);
 if(d['간접비']>iMax)r.push({lv:'error',t:'간접비',m:'직접비의 '+P.indirectPct+'%('+won(iMax)+')를 넘습니다. '+won(d['간접비']-iMax)+' 초과.'});
 S.items.forEach(i=>{
  if(i.cat==='연구시설·장비비'&&i.amount>=P.equipReview)r.push({lv:'warn',t:'장비 심의',m:'“'+esc(i.name)+'”('+won(i.amount)+')은 기준 금액('+won(P.equipReview)+') 이상입니다. 도입 심의 대상인지 확인하세요.'});
  if(/(노트북|컴퓨터|pc|태블릿|프린터|모니터|데스크탑)/i.test(i.name))r.push({lv:'warn',t:'범용성 장비',m:'“'+esc(i.name)+'”은 범용성 장비입니다. 과제 관련성을 계획서에 적고 구입 사유서를 준비하세요.'});
  if(/(외주|용역)/.test(i.name)&&direct&&i.amount>direct*0.4)r.push({lv:'warn',t:'외주 비중',m:'“'+esc(i.name)+'”이 직접비의 40%를 넘습니다. 핵심 연구를 외부에 맡기는 것으로 보일 수 있습니다.'});
 });
 if(S.project.total){const diff=S.project.total-tot;
  if(diff>0)r.push({lv:'warn',t:'미배정',m:'총 연구개발비보다 '+won(diff)+' 적게 편성했습니다.'});
  if(diff<0)r.push({lv:'error',t:'초과',m:'총 연구개발비를 '+won(-diff)+' 초과했습니다.'});}
 if(!r.length)r.push({lv:'good',t:'통과',m:'계상기준 점검에서 걸리는 항목이 없습니다.'});
 return r;}

/* ---------- F2 지출 판정 ---------- */
function judge(q){
 const t=q.toLowerCase();
 const hits=S.rules.map(r=>({r:r,n:r.kw.filter(k=>k&&t.includes(k.toLowerCase())).length})).filter(h=>h.n>0)
  .sort((a,b)=>b.n-a.n||(a.r.verdict==='불가'?-1:1));
 const amt=firstAmt(q);
 if(!hits.length)return{q:q,verdict:'전문기관 확인',rule:null,more:[],amt:amt};
 let top=hits[0].r;const no=hits.find(h=>h.r.verdict==='불가');if(no)top=no.r;

 if(S.budget&&top.cat&&amt){const left=S.budget[top.cat]-spent(top.cat);if(amt>left)notes.push(top.cat+' 잔액('+won(left)+')보다 큰 금액입니다. 비목 변경 절차가 필요할 수 있습니다.');}
 if(top.status!=='검수 완료')notes.push('이 규정은 아직 전문가 검수 전인 초안입니다.');
 return{q:q,verdict:top.verdict,rule:top,more:hits.map(h=>h.r).filter(r=>r!==top).slice(0,2),amt:amt,notes:notes};}

 let h='<div class="inner"><div class="head"><div><h1>규정 DB</h1><p>판정과 계상기준 점검이 근거로 삼는 규정입니다. 조항과 기준 수치를 고치고 검수 상태를 바꿀 수 있습니다.</p></div><div class="row"><button class="btn ghost sm" data-act="export-rules">내보내기</button><label class="btn ghost sm" style="flex:0 0 auto;flex-direction:row;color:var(--ink)">가져오기<input type="file" id="rules-file" accept=".json" hidden></label></div></div>';
 if(dr)h+='<p class="note">규정 '+dr+'건이 아직 <b>초안</b>입니다. 일반 원칙을 옮긴 것이어서 조항 번호와 수치가 확인되지 않았습니다. 실제 공고와 사용 기준을 보고 조항을 채운 뒤 “검수 완료”로 바꿔 주세요.</p>';
 h+='<div class="params"><label>연구수당 상한<span class="unit">인건비의<input class="num" data-pa="allowancePct" inputmode="numeric" value="'+P.allowancePct+'">%</span></label><label>간접비 상한<span class="unit">직접비의<input class="num" data-pa="indirectPct" inputmode="numeric" value="'+P.indirectPct+'">%</span></label><label>장비 심의 기준 금액<span class="unit"><input class="num" data-pa="equipReview" inputmode="numeric" value="'+P.equipReview.toLocaleString('ko-KR')+'">원</span></label></div>';
 h+='<div class="panel"><h2>규정 항목 '+S.rules.length+'건 <button class="btn sm ghost sp" data-act="add-rule">항목 추가</button></h2>';
 h+=S.rules.map(r=>{const o=S.openRule===r.id;const f=(k,l,t)=>'<label>'+l+(t?'<textarea data-ru="'+r.id+'" data-f="'+k+'">'+esc(r[k])+'</textarea>':'<input data-ru="'+r.id+'" data-f="'+k+'" value="'+esc(k==='kw'?r.kw.join(', '):r[k])+'">')+'</label>';
  return'<div class="rule"><button data-act="open-rule" data-id="'+r.id+'" aria-expanded="'+o+'">'+chip(r.verdict)+'<span class="t">'+esc(r.title)+'</span><span class="k">'+esc(r.kw.join(', '))+'</span><span class="chip '+(r.status==='검수 완료'?'rev':'draft')+'">'+esc(r.status)+'</span></button>'+(o?'<div class="rule-edit"><div class="row">'+f('title','항목')+'<label style="flex:0 1 150px">판정<select data-ru="'+r.id+'" data-f="verdict">'+['가능','조건부','불가'].map(v=>'<option'+(v===r.verdict?' selected':'')+'>'+v+'</option>').join('')+'</select></label><label style="flex:0 1 170px">검수 상태<select data-ru="'+r.id+'" data-f="status">'+['초안','검수 완료'].map(v=>'<option'+(v===r.status?' selected':'')+'>'+v+'</option>').join('')+'</select></label></div>'+f('kw','키워드 (쉼표로 구분)')+f('cond','판단 내용',1)+'<div class="row">'+f('source','근거 규정')+f('clause','조항')+'</div><div class="row">'+f('docs','필요 서류')+f('due','기한')+'</div><div class="actions" style="margin-top:4px"><button class="btn text sp" data-act="del-rule" data-id="'+r.id+'">이 항목 삭제</button></div></div>':'')+'</div>';}).join('');
 return h+'</div></div>';}

/* ---------- 동작 ---------- */
const SAMPLE_PLAN='과제명: AI 기반 소형 부품 외관검사 솔루션 개발\n총 연구개발비 1억 2,000만 원 (정부지원연구개발비 9,000만 원)\n연구개발기간: 12개월\n\n[참여인력]\n책임연구원 김OO 월 400만 원, 참여율 50%\n연구원 이OO 월 300만 원, 참여율 100%\n\n[사용 계획]\n- 검사용 산업 카메라 장비 구입 1,500만 원\n- 개발용 노트북 1대 250만 원\n- 시제품 제작 재료 800만 원\n- 클라우드 GPU 이용료 600만 원\n- 특허 출원 300만 원\n- 국내 출장 및 회의 200만 원';
function applyPlan(text){S.planText=text;const r=extractPlan(text);S.project=r.project;if(r.people.length)S.people=r.people;if(r.items.length)S.items=r.items;S.draft=null;return r;}
function loadDemo(){
 S=blank();applyPlan(SAMPLE_PLAN);makeDraft();S.budget=Object.assign({},S.draft);S.step=3;
 S.expenses=[{id:uid(),date:today(),cat:'인건비',amount:5000000,memo:'1개월차 인건비'},{id:uid(),date:today(),cat:'연구재료비',amount:1800000,memo:'시제품 프레임 가공'},{id:uid(),date:today(),cat:'연구활동비',amount:550000,memo:'클라우드 GPU 1개월'}];
 S.todos=[{id:uid(),text:'참여연구원 확인서 제출',due:'',done:true},{id:uid(),text:'산업 카메라 비교견적 2곳 받기',due:today(),done:false},{id:uid(),text:'노트북 구입 사유서 작성',due:'',done:false}];
 S.tab='dash';}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s);});}
async function readFile(f){
 if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){
  if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}
  const pdf=await window.pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let out='';
  for(let i=1;i<=pdf.numPages;i++){const c=await(await pdf.getPage(i)).getTextContent();let y=null;c.items.forEach(it=>{if(y!==null&&Math.abs(it.transform[5]-y)>2)out+='\n';out+=it.str;y=it.transform[5];});out+='\n';}
  return out;}
 return await f.text();}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function done(){save();render();S.note='';}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tab],[data-act],[data-q]');if(!t)return;
 if(t.dataset.tab){S.tab=t.dataset.tab;done();window.scrollTo(0,0);return;}
 if(t.dataset.q){doAsk(t.dataset.q);return;}
 const a=t.dataset.act,id=t.dataset.id;
 if(a==='demo'){if(S.budget&&!confirm('지금 내용을 지우고 예시 과제를 불러올까요?'))return;loadDemo();}
 else if(a==='reset'){if(!confirm('입력한 내용을 모두 지울까요? 되돌릴 수 없습니다.'))return;S=blank();}
 else if(a==='step'){S.step=+t.dataset.step;}
 else if(a==='sample-plan'){S.planText=SAMPLE_PLAN;}
 else if(a==='extract'){const txt=$('#plan-text').value.trim();if(!txt){$('#plan-msg').textContent='계획서 내용을 먼저 넣어 주세요.';return;}
  const r=applyPlan(txt);S.step=2;S.note='계획서에서 인력 '+r.people.length+'명, 항목 '+r.items.length+'건을 읽었습니다. 맞는지 확인하고 틀린 곳은 고쳐 주세요.';}
 else if(a==='add-person')S.people.push({id:uid(),name:'참여연구원',salary:0,rate:100});
 else if(a==='del-person')S.people=S.people.filter(x=>x.id!==id);
 else if(a==='add-item')S.items.push({id:uid(),name:'새 항목',amount:0,cat:'연구활동비'});
 else if(a==='del-item')S.items=S.items.filter(x=>x.id!==id);
 else if(a==='make-draft'){makeDraft();S.step=3;}
 else if(a==='confirm-budget'){if(validate(S.draft).some(v=>v.lv==='error')&&!confirm('기준을 넘는 항목이 있습니다. 그래도 확정할까요?'))return;S.budget=Object.assign({},S.draft);S.tab='dash';}
 else if(a==='csv'){download('rlink-budget.csv','\ufeff비목,금액(원)\n'+CATS.map(c=>c+','+(S.draft[c]||0)).join('\n')+'\n합계,'+sum(S.draft)+'\n','text/csv');return;}
 else if(a==='del-exp')S.expenses=S.expenses.filter(x=>x.id!==id);
 else if(a==='toggle-todo'){const x=S.todos.find(x=>x.id===id);if(x)x.done=!x.done;}
 else if(a==='del-todo')S.todos=S.todos.filter(x=>x.id!==id);
 else if(a==='del-q')S.queries=S.queries.filter(x=>x.id!==id);
 else if(a==='to-todo'){const q=S.queries.find(x=>x.id===id),r=q&&S.rules.find(x=>x.id===q.ruleId);if(r){r.docs.split(/,\s*/).forEach(d=>S.todos.push({id:uid(),text:d.trim()+' 준비 ('+q.q.slice(0,18)+')',due:'',done:false}));q.todoAdded=true;}}
 else if(a==='open-rule'){S.openRule=S.openRule===id?null:id;}
 else if(a==='add-rule'){const n={id:uid(),title:'새 규정 항목',kw:[],verdict:'조건부',cond:'',docs:'',due:'',cat:'',source:SRC,clause:'조항 확인 필요',status:'초안'};S.rules.unshift(n);S.openRule=n.id;}
 else if(a==='del-rule'){if(!confirm('이 규정 항목을 삭제할까요?'))return;S.rules=S.rules.filter(x=>x.id!==id);}
 else if(a==='export-rules'){download('rlink-rules.json',JSON.stringify({params:S.params,rules:S.rules},null,2),'application/json');return;}
 else return;
 done();
});
function doAsk(q){const r=judge(q);S.queries.push({id:uid(),q:q,verdict:r.verdict,ruleId:r.rule?r.rule.id:null,notes:r.notes||[],expert:''});if(S.queries.length>200)S.queries.shift();S.tab='ask';done();window.scrollTo(0,0);}
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target,k=f.dataset.form,d=new FormData(f);
 if(k==='ask'){const q=String(d.get('q')).trim();if(q)doAsk(q);return;}
 if(k==='expense'){const amt=num(d.get('amount'));if(amt<=0){$('#exp-msg').innerHTML='<div class="msg"><b>금액</b><span>금액을 숫자로 입력하세요.</span></div>';return;}
  const cat=d.get('cat'),left=(S.budget[cat]||0)-spent(cat);
  if(amt>left&&!confirm(cat+' 잔액('+won(left)+')을 넘는 금액입니다. 그래도 등록할까요?'))return;
  S.expenses.push({id:uid(),date:d.get('date'),cat:cat,amount:amt,memo:String(d.get('memo')).trim()});}
 if(k==='todo')S.todos.push({id:uid(),text:String(d.get('text')).trim(),due:d.get('due')||'',done:false});
 done();
});
document.addEventListener('change',async e=>{
 const t=e.target,ds=t.dataset;
 if(t.id==='plan-file'&&t.files[0]){const m=$('#plan-msg');m.textContent='파일을 읽는 중입니다…';
  try{const txt=(await readFile(t.files[0])).trim();S.planText=txt;done();$('#plan-msg').textContent=txt?'파일을 읽었습니다. “계획서 읽기”를 누르세요.':'파일에서 글자를 찾지 못했습니다. 스캔본이면 내용을 직접 붙여 넣어 주세요.';}
  catch(err){m.textContent='파일을 읽지 못했습니다. 내용을 직접 붙여 넣어 주세요.';}return;}
 if(t.id==='rules-file'&&t.files[0]){try{const j=JSON.parse(await t.files[0].text());if(!Array.isArray(j.rules))throw 0;S.rules=j.rules.map(r=>Object.assign({id:uid(),title:'',kw:[],verdict:'조건부',cond:'',docs:'',due:'',cat:'',source:SRC,clause:'',status:'초안'},r));if(j.params)Object.assign(S.params,j.params);done();}catch(err){alert('규정 파일 형식이 맞지 않습니다.');}return;}
 if(t.id==='plan-text'){S.planText=t.value;save();return;}
 if(ds.act==='toggle-todo')return;
 if(ds.p){S.project[ds.p]=ds.p==='name'?t.value:num(t.value);if(ds.p==='months'&&S.project.months<1)S.project.months=1;}
 else if(ds.pe){const p=S.people.find(x=>x.id===ds.pe);if(p)p[ds.f]=ds.f==='name'?t.value:num(t.value);}
 else if(ds.it){const i=S.items.find(x=>x.id===ds.it);if(i)i[ds.f]=ds.f==='amount'?num(t.value):t.value;}
 else if(ds.dr){S.draft[ds.dr]=num(t.value);}
 else if(ds.ex){const q=S.queries.find(x=>x.id===ds.ex);if(q)q.expert=t.value;}
 else if(ds.pa){S.params[ds.pa]=num(t.value);}
 else if(ds.ru){const r=S.rules.find(x=>x.id===ds.ru);if(r)r[ds.f]=ds.f==='kw'?t.value.split(',').map(s=>s.trim()).filter(Boolean):t.value;}
 else return;
 done();
});
render();
</script>
</body>
